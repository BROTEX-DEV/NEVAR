<!doctype html>
<html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="مقاله ای از NEVAR"><meta name="theme-color" content="#050b19">
<title>مقاله | NEVAR</title>
<style>
:root{--g:#155b3b;--g2:#238552;--o:#f28b35;--bg:#f6f8f3;--ink:#18251d;--muted:#65746a;--line:#dce6dc;--surface:#fff;--soft:#eaf3eb}
:root[data-theme="dark"]{color-scheme:dark;--bg:#101713;--ink:#e8f0e9;--muted:#a3b3a7;--line:#2b3b30;--g:#56bd80;--surface:#18231c;--soft:#18251d}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.9 Tahoma,Arial,sans-serif;transition:background .2s,color .2s}
.wrap{width:min(1120px,92%);margin:auto}a{text-decoration:none;color:inherit}
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:9px;color:var(--g);font-size:23px;font-weight:900}.brand svg{width:39px;height:39px}
.links,.social{display:flex;align-items:center;gap:15px;font-size:13px}.links a:hover{color:var(--o)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);border-radius:12px;padding:9px 14px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:bold;cursor:pointer;transition:transform .2s,border-color .2s}
.btn:hover{transform:translateY(-2px);border-color:var(--g)}.btn.green{background:var(--g);border-color:var(--g);color:white}.btn.orange{background:var(--o);border-color:var(--o);color:#2b1a0a}.theme-toggle{white-space:nowrap}.menu{display:none}
.article-shell{padding:34px 0 70px;min-height:65vh}.article-panel{max-width:850px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,4vw,42px);box-shadow:0 14px 45px #173b200a}
.article h1{font-size:clamp(28px,5vw,44px);line-height:1.5;margin:12px 0 16px;color:var(--g)}.muted{color:var(--muted);font-size:13px}.cover{display:block;width:100%;max-height:430px;object-fit:cover;border-radius:17px;margin:0 0 20px;background:var(--soft)}
.content{white-space:pre-wrap;overflow-wrap:anywhere;line-height:2.15;font-size:16px}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.article-topline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.category-pill{display:inline-flex;background:var(--soft);color:var(--g);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:bold}
footer{background:var(--surface);border-top:1px solid var(--line);padding:20px 0;color:var(--muted);font-size:12px}.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.footlinks{display:flex;gap:15px;flex-wrap:wrap}.version{text-align:center;font-size:9px;opacity:.7;margin-top:8px}
@media(max-width:760px){.nav{padding:10px 0;flex-wrap:wrap}.menu{display:inline-flex}.links{display:none;order:4;width:100%;flex-direction:column;align-items:stretch;gap:0}.links.open{display:flex}.links a{padding:8px 0;border-top:1px solid var(--line)}.social{margin-right:auto;gap:5px}.social .btn{font-size:10px;padding:7px 9px}.brand{font-size:20px}.brand svg{width:34px}.article-shell{padding:22px 0 45px}.article-panel{border-radius:16px}.content{font-size:15px}}
@media(max-width:400px){.brand{font-size:18px}.social .btn{padding:6px 7px}}

/* NEVAR logo palette: deep green + vivid orange */
:root{--g:#104b31;--g2:#24945a;--o:#ff8a24;--bg:#f7f7f0;--ink:#14251b;--muted:#637268;--line:#dce5d9;--surface:#fff;--soft:#e7f2e8}
.top{border-bottom:2px solid var(--o)}
.article-panel{border-top:3px solid var(--o);box-shadow:0 14px 45px #104b3110}
.category-pill{background:var(--soft);box-shadow:inset 0 0 0 1px #24945a20}
:root[data-theme="dark"] .article-panel{border-top-color:var(--o)}
/* Neon-blue NEVAR article theme v1.1.9 */
:root{color-scheme:dark;--g:#087cff;--o:#00e5ff;--bg:#050b19;--ink:#edf6ff;--muted:#9bb8d3;--line:#10466f;--surface:#07172d;--soft:#09213c}
:root[data-theme="dark"]{--bg:#050b19;--ink:#edf6ff;--muted:#9bb8d3;--line:#10466f;--g:#087cff;--surface:#07172d;--soft:#09213c}

body{background:radial-gradient(ellipse at 50% 0,#073264 0,transparent 40%),var(--bg);color:var(--ink)}
.top{background:#040d20ed;border-bottom:1px solid #0d4773}
.brand{color:#f2f8ff;direction:ltr;letter-spacing:6px}.brand svg{filter:drop-shadow(0 0 10px #00bfff66)}
.btn{background:#08203b;color:var(--ink);border-color:#14547f}.btn.green{background:linear-gradient(120deg,#087cff,#00bfe8);border-color:#00cfff;color:white}.btn.orange{background:#00dfff;color:#031326}
.article-panel{background:linear-gradient(145deg,#07172df5,#061226f8);border:1px solid #10466f;border-top:2px solid var(--o);box-shadow:0 0 40px #007cff10}
.article h1{color:var(--ink)}.category-pill{background:#06365b;color:var(--o);border:1px solid #105a85}
footer{background:transparent;border-top:1px solid #103452;color:var(--muted)}


/* Permanent NEVAR deep-space theme v1.1.9 */
:root{color-scheme:dark!important;--g:#087cff;--o:#00e5ff;--bg:#050b19;--ink:#edf6ff;--muted:#9bb8d3;--line:#10466f;--surface:#07172d;--soft:#09213c}
html,body{background:#050b19!important;color:#edf6ff!important}
.top{background:#040d20f5!important;border-color:#0d4773!important}
.links a{color:#d9e9ff!important}.links a:hover{color:#00e5ff!important}
.btn{background:#08203b!important;color:#edf6ff!important;border-color:#14547f!important}
.btn.green,.btn.orange{background:linear-gradient(120deg,#087cff,#00bfe8)!important;border-color:#00cfff!important;color:#fff!important}
.article-panel{background:linear-gradient(145deg,#07172df5,#061226f8)!important;border-color:#10466f!important;border-top:2px solid #00e5ff!important}
.category-pill{background:#06365b!important;color:#00e5ff!important;border-color:#105a85!important}
footer{background:#07172d!important;border-color:#103452!important;color:#82a8c9!important}
.version{color:#82a8c9!important}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script defer src="js/article.js?v=1.1.9"></script>
<script>
document.addEventListener("DOMContentLoaded",()=>{document.documentElement.dataset.theme="dark";document.documentElement.style.colorScheme="dark";const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content="#050b19";const m=document.getElementById("menu-toggle"),n=document.getElementById("navlinks");m?.addEventListener("click",()=>{const open=n.classList.toggle("open");m.setAttribute("aria-expanded",String(open))});n?.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>n.classList.remove("open")))});
</script>
